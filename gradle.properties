# Increase memory and pass the transformation flag directly to the JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.lang.Process.allowAmbiguousCommands=true -Dandroid.jdk.image.transformation.enabled=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Disable JDK image transformation to avoid jlink issues with spaces in paths
android.jdk.image.transformation.enabled=false
android.experimental.jdk.image.transformation.enabled=false
